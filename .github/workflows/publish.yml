name: Publish

# After CI is green on main, skills with a higher version go to the GEKI catalog.
# The publish job runs in the environment `publish`, which needs approval by a
# reviewer before every run. It does nothing until the repository variable
# PUBLISH_ENABLED is `true` and the secret GEKI_PUBLISH_KEY exists. See docs/publish.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: "Commit to compare with. Empty: every skill the platform does not have yet."
        required: false
        default: "HEAD^"

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    name: Which skills have a higher version?
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      skills: ${{ steps.plan.outputs.skills }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - id: plan
        env:
          INPUT_BASE: ${{ inputs.base }}
          EVENT: ${{ github.event_name }}
        run: |
          base="HEAD^"
          if [ "$EVENT" = "workflow_dispatch" ]; then base="$INPUT_BASE"; fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "skills=$(python ci/versions.py bumped --base "$base")" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to the GEKI catalog
    needs: plan
    if: ${{ needs.plan.outputs.skills != '[]' && vars.PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Publish
        env:
          GEKI_PUBLISH_ENABLED: "1"
          GEKI_PUBLISH_KEY: ${{ secrets.GEKI_PUBLISH_KEY }}
          GEKI_API_URL: ${{ vars.GEKI_API_URL || 'https://api.geki.ai' }}
          INPUT_BASE: ${{ inputs.base }}
          EVENT: ${{ github.event_name }}
        run: |
          base="HEAD^"
          if [ "$EVENT" = "workflow_dispatch" ]; then base="$INPUT_BASE"; fi
          python ci/publish.py --base "$base"
