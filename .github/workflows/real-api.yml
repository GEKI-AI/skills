name: Real API

# Weekly, read only, against real test accounts. It finds drift between the real API
# and the fixtures or the vendor spec. A tool without its secrets is skipped.
#
# Secrets: CONFLUENCE_URL, CONFLUENCE_TOKEN, ZAMMAD_URL, ZAMMAD_TOKEN, GH_TEST_TOKEN
# (the token for the GitHub test org, used as GITHUB_TOKEN), HUBSPOT_TOKEN.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real:
    name: Real API (${{ matrix.tool }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [confluence, zammad, github, hubspot]
    env:
      CONFLUENCE_URL: ${{ secrets.CONFLUENCE_URL }}
      CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
      ZAMMAD_URL: ${{ secrets.ZAMMAD_URL }}
      ZAMMAD_TOKEN: ${{ secrets.ZAMMAD_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_TEST_TOKEN }}
      HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ci/requirements.txt
      - name: Are the secrets of this tool available?
        id: secrets
        run: |
          missing=""
          for name in $(python ci/declared.py env "${{ matrix.tool }}"); do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "${{ matrix.tool }}: skipped, missing:$missing" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Read-only tests against the real API
        if: steps.secrets.outputs.enabled == 'true'
        env:
          REAL_API: "1"
        run: python -m pytest -m real_api -q -p no:cacheprovider $(python ci/declared.py paths "${{ matrix.tool }}")
