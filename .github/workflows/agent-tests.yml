name: Agent tests

# A vanilla Pi with a GEKI model runs the tasks of each skill against the mocks.
# It needs the secret GEKI_API_KEY (a key with the Models preset, a short expiry and a
# budget). Without the secret the job succeeds and does nothing.
# Pull requests from forks have no secrets. A maintainer moves the branch into this
# repository to run these tests.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PRISM_VERSION: 5.16.0
  PI_VERSION: 1.4.0

jobs:
  agent:
    name: Agent tests (${{ matrix.tool }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [confluence, zammad, github, hubspot]
    steps:
      - name: Is the model key available?
        id: key
        env:
          KEY: ${{ secrets.GEKI_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "GEKI_API_KEY is not set: agent tests skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.key.outputs.enabled == 'true'
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        if: steps.key.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        if: steps.key.outputs.enabled == 'true'
        with:
          path: |
            .cache/prism
            .cache/mocks
          key: mocks-${{ matrix.tool }}-${{ env.PRISM_VERSION }}-${{ hashFiles('ci/specs.json') }}
      - name: Install Pi, Prism and the test tools
        if: steps.key.outputs.enabled == 'true'
        run: |
          pip install -r ci/requirements.txt
          npm install -g "@earendil-works/pi-coding-agent@${PI_VERSION}"
          [ -x .cache/prism/node_modules/.bin/prism ] || npm install --prefix .cache/prism "@stoplight/prism-cli@${PRISM_VERSION}"
          python ci/mocks.py start "${{ matrix.tool }}" | tee -a "$GITHUB_ENV"
      - name: Run the tasks (three runs each, two must pass)
        if: steps.key.outputs.enabled == 'true'
        env:
          GEKI_API_KEY: ${{ secrets.GEKI_API_KEY }}
          AGENT_TEST_MODEL: ${{ vars.AGENT_TEST_MODEL }}
          AGENT_TEST_BASE_URL: ${{ vars.AGENT_TEST_BASE_URL }}
          AGENT_JUDGE_MODEL: ${{ vars.AGENT_JUDGE_MODEL }}
        run: |
          args=""
          for name in $(python ci/declared.py names "${{ matrix.tool }}"); do args="$args --skill $name"; done
          # An empty variable must fall back to the default in the script.
          for v in AGENT_TEST_MODEL AGENT_TEST_BASE_URL AGENT_JUDGE_MODEL; do
            [ -n "$(printenv $v)" ] || unset $v
          done
          python ci/agent_test.py $args
