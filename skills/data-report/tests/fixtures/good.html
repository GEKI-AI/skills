<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders, January to March 2026</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; }
main { max-width: 760px; margin: 0 auto; padding: 16px; }
.scroll { overflow-x: auto; }
svg { width: 100%; height: auto; }
td, th { text-align: right; padding: 4px 8px; }
</style>
</head>
<body>
<main>
<h1>Orders, January to March 2026</h1>
<p>Source: orders.csv, data as of 31.03.2026. Revenue was 1,240 € in three months.</p>
<h2>Revenue per month</h2>
<svg viewBox="0 0 400 200" role="img" aria-label="Revenue per month">
  <line x1="40" y1="170" x2="390" y2="170" stroke="#999"/>
  <rect x="60" y="90" width="80" height="80" fill="#1f5fbf"/>
  <rect x="170" y="50" width="80" height="120" fill="#1f5fbf"/>
  <rect x="280" y="110" width="80" height="60" fill="#1f5fbf"/>
  <text x="100" y="188" font-size="12" text-anchor="middle">Jan</text>
  <text x="210" y="188" font-size="12" text-anchor="middle">Feb</text>
  <text x="320" y="188" font-size="12" text-anchor="middle">Mar</text>
  <text x="100" y="82" font-size="12" text-anchor="middle">400 €</text>
  <text x="210" y="42" font-size="12" text-anchor="middle">540 €</text>
  <text x="320" y="102" font-size="12" text-anchor="middle">300 €</text>
</svg>
<div class="scroll">
<table>
<tr><th>Month</th><th>Orders</th><th>Revenue</th></tr>
<tr><td>Jan</td><td>8</td><td>400 €</td></tr>
<tr><td>Feb</td><td>11</td><td>540 €</td></tr>
<tr><td>Mar</td><td>6</td><td>300 €</td></tr>
<tr><td>Total</td><td>25</td><td>1,240 €</td></tr>
</table>
</div>
</main>
</body>
</html>
